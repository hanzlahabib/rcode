# Development Area Labels
- name: "area: fe"
  color: "1d76db"
  description: "Frontend (UI, components, client-side logic)"

- name: "area: be"
  color: "0e8a16"
  description: "Backend (Server, APIs, database)"

- name: "area: ml"
  color: "5319e7"
  description: "Machine Learning (Modeling, feature engineering, evaluation)"

- name: "area: mobile/android"
  color: "ff7f50"
  description: "Work related only to Android applications"

- name: "area: mobile/ios"
  color: "ff69b4"
  description: "Work related only to iOS applications"

- name: "area: mobile/both"
  color: "ffa500"
  description: "Work related to both Android and iOS applications"

- name: "area: security"
  color: "b60205"
  description: "Vulnerabilities, audits, fixes"

# Category Labels
- name: "category: design"
  color: "f1c40f"
  description: "Design, wireframes, mockups"

- name: "category: ci/cd"
  color: "0052cc"
  description: "Deployment scripts, CI/CD, infrastructure"

- name: "category: documentation"
  color: "0075ca"
  description: "Writing or updating documentation, guides, READMEs"

- name: "category: chores"
  color: "8c8c8c"
  description: "Maintenance, housekeeping, or non-feature work"

- name: "category: refactor"
  color: "9932CC"
  description: "Code restructuring or improvements without adding new functionality"

# Module/Domain Labels (examples - customize based on your project)
- name: "module: search"
  color: "FF6347"
  description: "Search module"

- name: "module: chat"
  color: "32CD32"
  description: "Chat module"

- name: "module: agents"
  color: "4169E1"
  description: "Agents module"

- name: "module: ai-meet"
  color: "FF8C00"
  description: "AI Meet module"

