# GitHub Labels Configuration for rcode
# Curated taxonomy applied via the github-label-sync tool or repo settings.
# 5 groups: priority, type, area, status, lifecycle.

# === Priority (urgency) ===
- name: "priority: critical"
  color: "b60205"
  description: "Blocks release or breaks the product for many users"

- name: "priority: high"
  color: "d93f0b"
  description: "Important — schedule for the next release"

- name: "priority: medium"
  color: "fbca04"
  description: "Worth doing — schedule when time allows"

- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have — no urgency"

# === Type (kind of work) ===
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as documented"

- name: "type: enhancement"
  color: "a2eeef"
  description: "New feature or improvement to an existing feature"

- name: "type: docs"
  color: "0075ca"
  description: "Documentation, README, examples, comments"

- name: "type: refactor"
  color: "5319e7"
  description: "Code restructuring with no behaviour change"

- name: "type: perf"
  color: "1d76db"
  description: "Performance — speed, memory, token usage"

- name: "type: security"
  color: "ee0701"
  description: "Security concern, vulnerability, hardening"

- name: "type: ci"
  color: "f9d0c4"
  description: "Continuous integration, GitHub Actions, tests"

- name: "type: chore"
  color: "e1e4e8"
  description: "Housekeeping — deps, configs, build scripts"

# === Area (which part of rcode) ===
- name: "area: cli"
  color: "c5def5"
  description: "cli/ — installer, update, uninstall, doctor"

- name: "area: workflows"
  color: "c5def5"
  description: "rcode/workflows/ — slash-command flows"

- name: "area: skills"
  color: "c5def5"
  description: "rcode/skills/ — phrase-activated playbooks"

- name: "area: agents"
  color: "c5def5"
  description: "rcode/agents/ — personas and workflow specialists"

- name: "area: memory"
  color: "c5def5"
  description: "Memory Bank, distillates, .rcode/memory/"

- name: "area: brain"
  color: "c5def5"
  description: "rcode/brain/ — external docs pull"

- name: "area: dashboard"
  color: "c5def5"
  description: "Diwan dashboard at port 7717"

- name: "area: tests"
  color: "c5def5"
  description: "test/ — compliance, schema, behavioural"

# === Status (lifecycle within the issue tracker) ===
- name: "status: needs-triage"
  color: "fef2c0"
  description: "Awaiting maintainer review and labelling"

- name: "status: in-progress"
  color: "0e8a16"
  description: "Actively being worked on"

- name: "status: blocked"
  color: "e99695"
  description: "Cannot proceed — waiting on something"

- name: "status: needs-info"
  color: "d4c5f9"
  description: "Awaiting more details from reporter"

- name: "status: ready-for-review"
  color: "bfdadc"
  description: "Implementation done, awaiting code review"

# === Resolution (how it closed) ===
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope or working as designed"

- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked in another issue"

- name: "stale"
  color: "cccccc"
  description: "Auto-closed by stale-bot or manual triage"

# === Community ===
- name: "good first issue"
  color: "7057ff"
  description: "Good starting point for new contributors"

- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome a PR"
