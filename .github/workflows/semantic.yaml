name: Semantic PR
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

# action-semantic-pull-request reads the PR via the API; with restricted
# default workflow permissions the GITHUB_TOKEN lacks that scope and the
# action dies with "Resource not accessible by integration" (#889).
permissions:
  pull-requests: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            style
            refactor
            test
            chore
            perf
            revert
          scopes: |
            agents
            skills
            workflows
            templates
            dashboard
            docs
            config
            github
            commands
            memory
            brand
            cli
            ci
            release
            meta
            tasks
            migrations
            refs
            state
            hooks
            install
            parity
            triggers
            dogfood
            namespace
            planning
            insights
            help
            roadmap
            session
            audits
            execute
            executor
            plan
            planner
            readme
            sync
            sprint
            agent-exp
            extensibility
            lens-audit
            tiers
            build
            council
            doctor
            postinstall
            progress
            security
            tools
            uninstall
            update
            test
            changelog
            scopes
            phases
            references
            kanban
            orchestrator
            orchpanel
            status
            bin
            brain
            dogfeed
            new-project
            package
            rcode-tools
            rihal-tools
            team
            usp
            v4
            observability
            audit
          requireScope: false
          ignoreLabels: |
            bot
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          validateSingleCommit: true
          wip: true
