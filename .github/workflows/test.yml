name: test

# Runs the zero-dep test suite on every push + pull request.
# No secrets, no external services, no network — every test runs in
# a fresh tempdir using only Node.js built-ins. A fork PR from a new
# contributor gets the same result as a push from the maintainer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test on Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Match the package.json engines.node minimum and the current LTS
        node-version: ['18.x', '20.x', '22.x', '24.x']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Install IS required: the suite exercises cli/install.js, cli/update.js,
      # cli/lib/schemas.cjs and cli/lib/prompts.cjs, which require devDependencies
      # (zod, picocolors, @clack/prompts). Runtime deps stay gated by the
      # `zero-dep invariant` job below — this installs build/test tooling only.
      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run tests
        run: node --test

  no-new-deps:
    name: zero-dep invariant
    runs-on: ubuntu-latest
    # bash + jq required — Linux only
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify package.json has no runtime dependencies
        run: |
          # Sole documented exception: `ws` powers the dashboard orchestrator
          # terminal (server/orchestrator.js). It is lazy-required with a
          # graceful fallback, but must ship for `pnpm dlx` users since
          # `server/` is in the published files list. Anything else fails.
          BAD=$(jq -r '.dependencies // {} | keys[] | select(. != "ws")' package.json)
          if [ -n "$BAD" ]; then
            echo "❌ Unapproved runtime dependencies: $BAD"
            echo "   This project is intentionally zero-dep — see ADR 0001."
            jq '.dependencies' package.json
            exit 1
          fi
          echo "✓ runtime dependencies limited to the documented exception (ws)"

      - name: verify devDependencies are build-only (no runtime deps allowed)
        run: |
          # devDependencies are allowed for build tooling (esbuild bundles them).
          # They must NOT appear in dependencies{} (that's the runtime zero-dep gate above).
          # Enforce: only whitelisted build tools in devDependencies.
          ALLOWED="esbuild picocolors nanospinner fast-glob zod semver diff update-notifier @clack/prompts"
          DEVDEPS=$(jq -r '.devDependencies // {} | keys[]' package.json 2>/dev/null || true)
          BAD=""
          for dep in $DEVDEPS; do
            found=0
            for allowed in $ALLOWED; do
              [ "$dep" = "$allowed" ] && found=1 && break
            done
            [ "$found" -eq 0 ] && BAD="$BAD $dep"
          done
          if [ -n "$BAD" ]; then
            echo "❌ Unapproved devDependencies:$BAD"
            echo "   Add to the ALLOWED list in test.yml if intentional."
            exit 1
          fi
          echo "✓ devDependencies are build-tool only"

  syntax-check:
    name: syntax check all cli files
    runs-on: ubuntu-latest
    # Uses bash + find — Linux only; Windows/macOS covered by the test matrix
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: verify every cli source file parses
        run: |
          find cli -name '*.js' -o -name '*.cjs' | while read -r f; do
            node -c "$f" || exit 1
          done
          echo "✓ all cli/ files parse cleanly"
