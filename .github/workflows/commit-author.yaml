name: Check Commit Author
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dguo/check-author-and-committer-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Allow real email addresses and GitHub noreply.
          # For rcode internal forks, add '@rcode\.om' to the regex.
          committer-email-regex: '@users\.noreply\.github\.com|@github\.com$|.+@.+\..+'
          author-email-regex: '@users\.noreply\.github\.com|@github\.com$|.+@.+\..+'
