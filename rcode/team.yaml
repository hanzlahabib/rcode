# Council panel routing rules
# These rules determine which agents are spawned for different question types.
# Panel scorer (council-panel.cjs) picks from these based on keyword signals.
routing:
  market:
    - rcode-mariam      # leads
    - rcode-hussain-pm  # scopes
    - rcode-sadiq       # kill criteria
  codebase:
    - rcode-waleed      # architecture lead
    - rcode-yousef      # backend implementation
    - rcode-fatima      # quality gates
  performance:
    - rcode-yousef      # backend perf diagnosis owns p50/p95/throughput
    - rcode-waleed      # architecture-level perf decisions (caching, sharding)
    - rcode-fatima      # benchmarking + regression guards
  ml:
    - rcode-zayd        # ML/OCR/retrieval lead
    - rcode-yousef      # integration points (queues, APIs)
    - rcode-fatima      # eval + perf testing
  frontend:
    - rcode-haitham     # React/Next.js/RTL implementation
    - rcode-layla       # UX + interaction design
    - rcode-fatima      # accessibility + visual regression
  team:
    - rcode-sadiq       # leads
    - rcode-nasser      # people/ops
  release:
    - rcode-fatima      # leads
    - rcode-waleed      # architecture
    - rcode-khalid      # infra/deploy (if installed)
  design:
    - rcode-layla       # UX design lead
    - rcode-zahra       # branding + visual identity
    - rcode-waleed      # technical feasibility
  greenfield:
    - rcode-mariam      # market
    - rcode-hussain-pm  # scope
    - rcode-waleed      # feasibility
    - rcode-sadiq       # strategic fit

