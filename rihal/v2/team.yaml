# Rihal v2 Agent Roster
# Structured definition of all installed agents: roles, authority levels, domain keywords for council dispatch
# Updated: 2026-04-12

agents:
  - id: rihal-sadiq
    name: Sadiq (صادق)
    file_path: rihal/v2/agents/rihal-sadiq.md
    role: Director of Strategy
    authority_level: strategic
    domain_keywords:
      - strategy
      - priority
      - kill-criterion
      - opportunity-cost
      - should-we-build
      - timing
      - market-opportunity
    description: Pushes for measurable outcomes and kill criteria. Answers "should we build this", "why now", "what NOT to do" questions.

  - id: rihal-waleed
    name: Waleed (وليد)
    file_path: rihal/v2/agents/rihal-waleed.md
    role: Chief Technology Officer
    authority_level: technical
    domain_keywords:
      - architecture
      - stack
      - feasibility
      - security
      - scale
      - performance
      - tech-debt
      - database
      - infrastructure
    description: Answers architecture, stack selection, technical feasibility, security, and scale questions.

  - id: rihal-fatima
    name: Fatima (فاطمة)
    file_path: rihal/v2/agents/rihal-fatima.md
    role: QA Lead
    authority_level: quality
    domain_keywords:
      - quality
      - testing
      - test-strategy
      - coverage
      - release-readiness
      - regression
      - bugs
      - qa-gates
    description: Answers quality gates, test strategy, coverage, release readiness, and "is this production-ready" questions.

  - id: rihal-mariam
    name: Mariam (مريم)
    file_path: rihal/v2/agents/rihal-mariam.md
    role: Marketing & Growth Lead
    authority_level: growth
    domain_keywords:
      - market-research
      - discovery
      - user-research
      - gtm
      - positioning
      - messaging
      - growth-strategy
    description: Market research, user discovery, GTM strategy, positioning, and growth metrics.

  - id: rihal-hussain-pm
    name: Hussain (حسين)
    file_path: rihal/v2/agents/rihal-hussain-pm.md
    role: Product Manager
    authority_level: product
    domain_keywords:
      - scope
      - requirements
      - prd
      - user-stories
      - acceptance-criteria
      - backlog
    description: Scope, requirements, PRD writing, user stories, and backlog curation.

  - id: rihal-tech-writer
    name: Tech Writer
    file_path: rihal/v2/agents/rihal-tech-writer.md
    role: Technical Documentation Specialist
    authority_level: operational
    domain_keywords:
      - documentation
      - readme
      - api-docs
      - changelog
      - migration-guide
      - inline-comments
    description: Generates and updates README, API docs, changelogs, migration guides, and inline code comments.

utility_agents:
  - id: rihal-planner
    name: Rihal Planner
    role: Phase Planning
    authority_level: operational
    domain_keywords:
      - planning
      - phase-plan
      - task-breakdown
    description: Creates detailed implementation plans from scope and context.

  - id: rihal-executor
    name: Rihal Executor
    role: Implementation
    authority_level: operational
    domain_keywords:
      - implementation
      - execution
      - code-changes
    description: Executes planned work, commits changes, creates summaries.

  - id: rihal-verifier
    name: Rihal Verifier
    role: Quality Verification
    authority_level: quality
    domain_keywords:
      - verification
      - testing
      - validation
    description: Verifies phase completion and checks quality gates.

# Council panel routing rules
# These rules determine which agents are spawned for different question types
routing:
  market:
    - rihal-mariam      # leads
    - rihal-hussain-pm  # scopes
    - rihal-sadiq       # kill criteria
  codebase:
    - rihal-waleed      # leads
    - rihal-sadiq       # strategy
    - rihal-fatima      # quality
  team:
    - rihal-sadiq       # leads
  release:
    - rihal-fatima      # leads
    - rihal-waleed      # architecture
  design:
    - rihal-waleed      # technical feasibility (layla if installed)
  greenfield:
    - rihal-mariam      # market
    - rihal-hussain-pm  # scope
    - rihal-waleed      # feasibility
