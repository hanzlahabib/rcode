# Rihal Method — Team Roster
#
# Real Rihal team members are marked `real: true`. Placeholders are
# marked with `real: false` and a note — replace with your actual
# colleagues.
#
# Author Hanzla Habib uses this module as a personal assistant for his
# Rihal work, so the agent names reflect (or approximate) real Rihal
# colleagues where known.

